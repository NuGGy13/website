<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapticyze</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
        }

        .header h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #ff6b35, #ff8c42, #ff6b35);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header p {
            color: #ff8c42;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ff6b35;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(255, 107, 53, 0.3);
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 70%;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .message.user {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            margin-left: auto;
            border-bottom-right-radius: 5px;
            border: 1px solid rgba(255, 107, 53, 0.5);
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff6b35;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #ff8c42;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .send-btn {
            padding: 15px 25px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .typing-indicator {
            display: none;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
            border-radius: 10px;
            margin-right: auto;
            max-width: 70%;
            border-bottom-left-radius: 5px;
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots::after {
            content: '...';
            animation: typing 1.5s infinite;
        }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0; }
            30% { opacity: 1; }
        }

        .glow-effect {
            position: relative;
        }

        .glow-effect::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b35, #ff8c42, #ff6b35);
            border-radius: 17px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .glow-effect:focus-within::before {
            opacity: 1;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #ff6b35;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #ff8c42;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Synapticyze</h1>
            <p>Welcome to Synapticyze!</p>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <strong>Bot:</strong> Hello! I'm your neon chat bot. How can I help you today?
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <strong>Bot is typing</strong> <span class="typing-dots"></span>
            </div>

            <div class="input-container glow-effect">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type your message here..." maxlength="500">
                <button class="send-btn" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        // Sample bot responses
        const botResponses = [
            "That's interesting! Tell me more.",
            "I understand. How can I assist you further?",
            "Great question! Let me think about that.",
            "I'm here to help. What else would you like to know?",
            "Thanks for chatting! Is there anything specific you'd like to discuss?",
            "I appreciate your input. Let's continue the conversation!",
            "That's a good point. What are your thoughts on this?",
            "I'm learning from our conversation. What's next?",
            "Fascinating! I'd love to hear more about that.",
            "Let's explore this topic further. What do you think?"
        ];

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            messageDiv.innerHTML = `<strong>${isUser ? 'You' : 'Bot'}:</strong> ${content}`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        function getBotResponse() {
            return botResponses[Math.floor(Math.random() * botResponses.length)];
        }

        function sendMessage() {
            const message = chatInput.value.trim();
            if (message === '') return;

            addMessage(message, true);
            chatInput.value = '';

            showTyping();

            setTimeout(() => {
                hideTyping();
                addMessage(getBotResponse());
            }, 1000 + Math.random() * 2000); // Random delay between 1-3 seconds
        }

        sendBtn.addEventListener('click', sendMessage);

        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focus input on page load
        window.addEventListener('load', function() {
            chatInput.focus();
        });
    </script>
</body>
</html>
